<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mayaman na na ko?</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Mayaman%20Na%20Ba%20Ko%3F%22%2C%22short_name%22%3A%22Mayaman%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23f2f2f7%22%2C%22theme_color%22%3A%22%23f2f2f7%22%7D">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8a8a8e;--border:#e5e5ea;--green:#34c759;--red:#ff3b30;--blue:#007aff;--safe-bottom:env(safe-area-inset-bottom);--safe-top:env(safe-area-inset-top)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;font-size:17px}
    body{min-height:calc(100 * min(var(--vh,1vh),1vh))}
    button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #007aff66;outline-offset:2px}
    .app-shell{width:100%;min-height:calc(100 * min(var(--vh,1vh),1vh));display:flex;flex-direction:column}
    .topbar{padding:calc(13px + var(--safe-top)) 20px 12px;position:sticky;top:0;background:var(--bg);z-index:10}.topbar h1{margin:0}.date-line{margin:2px 0 0;color:var(--sub);font-size:14px}
    .main-area{flex:1;padding:0 16px 104px;overflow:auto}.view{display:none}.view.active{display:block}
    .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px #0000000a}.card h2{margin:0 0 12px;font-size:14px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase}
    .balance{font-size:40px;font-weight:700;margin:0}.negative{color:var(--red)}.positive{color:var(--green)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}.name{font-weight:600;font-size:16px}.meta{font-size:13px;color:var(--sub);margin-top:2px}.amount{font-weight:700;white-space:nowrap}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;margin-right:8px}
    .btn{border:0;border-radius:12px;padding:12px 16px;width:100%;font-weight:700;background:var(--blue);color:#fff}.btn.secondary{background:var(--border);color:var(--text)}.btn.danger{background:var(--red)}.btn.ghost{background:transparent;color:var(--blue)}.btn.small{width:auto;padding:8px 11px;font-size:14px}.button-row{display:flex;gap:8px;margin-top:10px}.button-row .btn{flex:1}
    .empty{text-align:center;color:var(--sub);padding:28px 12px;font-size:15px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;padding:6px 0 calc(6px + var(--safe-bottom));border-top:1px solid var(--border);background:#fffffff0;backdrop-filter:blur(16px);z-index:20}.bottom-nav button{flex:1;border:0;background:transparent;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}.bottom-nav button.active{color:var(--blue)}.bottom-nav svg{width:23px;height:23px}
    .fab{position:fixed;right:20px;bottom:calc(74px + var(--safe-bottom));width:56px;height:56px;border:0;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 5px 15px #0004;z-index:21}.fab svg{width:25px}.fab:disabled,.btn:disabled{opacity:.55;cursor:wait}
    .month-nav{display:flex;align-items:center;justify-content:space-between}.month-nav button{width:40px;height:36px;border:0;border-radius:10px;background:var(--border);font-size:26px}
    .field{margin-bottom:14px}.field label{display:block;color:var(--sub);font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:11px 12px;color:var(--text)}
    .seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--bg)}.seg button{flex:1;border:0;background:transparent;color:var(--sub);border-radius:8px;padding:9px 4px;font-weight:700;font-size:13px}.seg button.active{color:var(--text);background:#fff;box-shadow:0 1px 2px #0002}
    .sheet-overlay,.dialog-overlay{position:fixed;inset:0;background:#0007;z-index:50}.sheet-overlay{display:flex;align-items:flex-end}.sheet{width:100%;max-height:88%;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:15px 20px calc(24px + var(--safe-bottom))}.handle{width:36px;height:5px;background:var(--border);border-radius:10px;margin:0 auto 16px}.sheet h2{margin:0 0 16px;font-size:20px}.dialog-overlay{display:grid;place-items:center;padding:20px;z-index:60}.dialog{background:#fff;border-radius:16px;padding:20px;width:min(340px,100%);box-shadow:0 8px 30px #0004}.dialog p{margin:0 0 14px;line-height:1.45}.hidden{display:none!important}
    .bar-track{height:10px;border-radius:8px;background:var(--bg);overflow:hidden}.bar-fill{height:100%;border-radius:8px}.bar-label{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}.bar-row{margin:13px 0}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}.settings-row:last-child{border:0}
    @media(min-width:720px){.main-area{width:min(720px,100%);margin:0 auto}.topbar{padding-left:max(20px,calc((100% - 720px)/2));padding-right:max(20px,calc((100% - 720px)/2))}}
  </style>
 </head>
 <body>
  <div class="app-shell">
   <header class="topbar">
    <h1>Mayaman Na Ba Ko?</h1>
    <p class="date-line" id="date-line"></p>
   </header>
   <main class="main-area">
    <section id="view-dashboard" class="view active" aria-label="Dashboard"></section>
    <section id="view-activity" class="view" aria-label="Activity"></section>
    <section id="view-accounts" class="view" aria-label="Accounts"></section>
    <section id="view-schedules" class="view" aria-label="Schedules"></section>
    <section id="view-reports" class="view" aria-label="Reports"></section>
    <section id="view-settings" class="view" aria-label="Settings"></section>
   </main><button class="fab" type="button" aria-label="Add transaction" onclick="openTransaction()"> <i data-lucide="plus"></i> </button>
   <nav class="bottom-nav" aria-label="Main navigation">
    <button class="active" type="button" data-view="dashboard"><i data-lucide="home"></i><span>Home</span></button> <button type="button" data-view="activity"><i data-lucide="receipt"></i><span>Activity</span></button> <button type="button" data-view="accounts"><i data-lucide="wallet-cards"></i><span>Accounts</span></button> <button type="button" data-view="schedules"><i data-lucide="repeat"></i><span>Schedules</span></button> <button type="button" data-view="reports"><i data-lucide="bar-chart-2"></i><span>Reports</span></button> <button type="button" data-view="settings"><i data-lucide="settings-2"></i><span>Settings</span></button>
   </nav>
  </div>
  <div id="sheet-overlay" class="sheet-overlay hidden" onclick="if(event.target===this)closeSheet()">
   <section class="sheet" id="sheet-content" aria-label="Form panel"></section>
  </div>
  <div id="dialog-overlay" class="dialog-overlay hidden">
   <section class="dialog" id="dialog-content" role="dialog" aria-modal="true"></section>
  </div>
  <input type="file" id="import-file-input" accept="application/json" class="hidden" onchange="handleImportFile(event)">
  <script>
    const STORAGE_KEY = 'money_tracker_state';
    const expenseDefaults = ['Groceries','Dates','Transport','Shopping','Bills & Utilities','Socials','Health','Rent','Subscriptions','Hobbies','Insurance','Other','Travel','Pet','Lialto'];
    const incomeDefaults = ['Payroll','Interest','Credit','Other','Marf House'];
    const bankDefaults = ['BPI','UnionBank','Maya','GCash','CIMB','Tonik','GoTyme','Maribank'];
    const palette = ['#007aff','#34c759','#ff9500','#ff3b30','#af52de','#5ac8fa','#ffcc00','#ff2d55','#5856d6','#00c7be'];
    const colorTagDefaults = {'#007aff':'Personal','#34c759':'Payroll','#ff9500':'Lialto','#ff3b30':'Emergency Fund','#af52de':'Credit Card','#5ac8fa':'N/A','#ffcc00':'Future Investments','#ff2d55':'N/A','#5856d6':'N/A','#00c7be':'Travel'};
    const paletteNames = {'#007aff':'Blue','#34c759':'Green','#ff9500':'Orange','#ff3b30':'Red','#af52de':'Purple','#5ac8fa':'Sky Blue','#ffcc00':'Yellow','#ff2d55':'Pink','#5856d6':'Indigo','#00c7be':'Teal'};
    function colorTagLabel(color){return `${paletteNames[color]||'Color'} - ${(state?.colorTags||colorTagDefaults)[color]||'Unassigned'}`}
    let state = freshState(), ready = false;
    let activityMonth = today().slice(0,7), reportsMonth = today().slice(0,7), filterType = 'all', filterAccount = 'all';
    let pendingAction = null;
    function freshState(){ return {accounts:[],transactions:[],recurring:[],recurringTransfers:[],expenseCategories:[...expenseDefaults],incomeCategories:[...incomeDefaults],banks:[...bankDefaults],tags:[...new Set(Object.values(colorTagDefaults))],colorTags:{...colorTagDefaults}}; }
    function normalise(data){
      const base = freshState(), next = {...base,...data};
      ['expenseCategories','incomeCategories','banks','tags','accounts','transactions','recurring','recurringTransfers'].forEach(k=>{if(!Array.isArray(next[k]))next[k]=base[k]});
      next.colorTags={...colorTagDefaults,...(next.colorTags&&typeof next.colorTags==='object'?next.colorTags:{})};
      next.accounts=next.accounts.map(a=>({...a,tags:Array.isArray(a.tags)?a.tags:(typeof a.tags==='string'?a.tags.split(',').map(t=>t.trim()).filter(Boolean):[])}));
      next.accounts.forEach(a=>a.tags.forEach(t=>{if(!next.tags.includes(t))next.tags.push(t)}));
      return next;
    }
    function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
    function localDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
    function today(){return localDateStr(new Date())}
    function money(n){return (n<0?'-':'')+'₱'+Math.abs(Number(n||0)).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}
    function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
    function monthLabel(key){return new Date(key+'-02T00:00:00').toLocaleDateString('en-PH',{month:'long',year:'numeric'})}
    function shiftMonth(key,n){let [y,m]=key.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')}
    function categoryColor(c){let list=[...state.expenseCategories,...state.incomeCategories];return palette[Math.max(0,list.indexOf(c))%palette.length]}

    // ---- Persistence: plain browser localStorage, no external backend ----
    function saveState(){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }catch(e){
        toast('Could not save locally — your browser storage may be full.');
      }
    }
    function loadState(){
      try{
        const saved = localStorage.getItem(STORAGE_KEY);
        if(saved){
          const parsed = JSON.parse(saved);
          if(parsed && typeof parsed === 'object') state = normalise(parsed);
        }
      }catch(e){
        toast('Your saved data could not be read.');
      }
      ready = true;
    }
    function downloadBackup(){
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mayaman-backup-' + today() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
    function triggerImport(){ document.getElementById('import-file-input').click(); }
    function handleImportFile(event){
      const file = event.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const parsed = JSON.parse(reader.result);
          confirmAction('Import this backup? It will replace all data currently in the app.', () => {
            state = normalise(parsed);
            saveState();
            render();
            toast('Backup imported.');
          });
        }catch(e){
          toast('That file could not be read as a valid backup.');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }
    // ---- End persistence ----

    function balances(){
      let b={}; state.accounts.forEach(a=>b[a.id]=Number(a.startingBalance)||0);
      [...state.transactions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
        const a=state.accounts.find(x=>x.id===t.accountId); if(!a)return;
        if(t.type==='expense')b[a.id]+=a.type==='credit'?t.amount:-t.amount;
        if(t.type==='income')b[a.id]+=a.type==='credit'?-t.amount:t.amount;
        if(t.type==='interest')b[a.id]+=t.amount;
        if(t.type==='payment'){b[a.id]+=a.type==='credit'?-t.amount:t.amount;if(t.fromAccountId in b)b[t.fromAccountId]-=t.amount+(t.fee||0)}
      }); return b;
    }
    function applyAutoRecurring(){
      let changed=false; const todayDate=new Date(today()+'T00:00:00');
      state.recurring.filter(r=>r.mode==='auto'&&r.active!==false&&r.startDate&&r.accountId).forEach(r=>{
        const start=new Date(r.startDate+'T00:00:00'); if(Number.isNaN(start.getTime()))return;
        const step=r.frequency==='Weekly'?7:r.frequency==='Quarterly'?91:30; let due=new Date(start);
        while(due<=todayDate){const dueDate=localDateStr(due);if(!state.transactions.some(t=>t.recurringId===r.id&&t.dueDate===dueDate)){state.transactions.push({id:uid(),type:'expense',amount:Number(r.amount)||0,category:r.category,accountId:r.accountId,fromAccountId:null,fee:0,date:dueDate,dueDate,recurringId:r.id,note:r.name,createdAt:Date.now()});changed=true}due.setDate(due.getDate()+step)}
      }); if(changed)saveState();
    }
    function applyAutoRecurringTransfers(){
      let changed=false; const todayDate=new Date(today()+'T00:00:00');
      state.recurringTransfers.filter(r=>r.mode==='auto'&&r.active!==false&&r.startDate&&r.fromAccountId&&r.toAccountId).forEach(r=>{
        const start=new Date(r.startDate+'T00:00:00'); if(Number.isNaN(start.getTime()))return;
        const step=r.frequency==='Weekly'?7:r.frequency==='Quarterly'?91:30; let due=new Date(start);
        while(due<=todayDate){const dueDate=localDateStr(due);if(!state.transactions.some(t=>t.recurringTransferId===r.id&&t.dueDate===dueDate)){state.transactions.push({id:uid(),type:'payment',amount:Number(r.amount)||0,category:'Payment / Transfer',accountId:r.toAccountId,fromAccountId:r.fromAccountId,fee:Number(r.fee)||0,date:dueDate,dueDate,recurringTransferId:r.id,note:r.name,createdAt:Date.now()});changed=true}due.setDate(due.getDate()+step)}
      }); if(changed)saveState();
    }
    function render(){
      applyAutoRecurring();
      applyAutoRecurringTransfers();
      document.getElementById('date-line').textContent=new Date().toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric'});
      const b=balances(); renderDashboard(b); renderActivity(); renderAccounts(b); renderSchedules(); renderReports(); renderSettings(); if(window.lucide)lucide.createIcons();
    }
    function switchView(name){
      document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+name));
      document.querySelectorAll('.bottom-nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===name)); render();
    }
    document.querySelectorAll('.bottom-nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
    function accountRow(a,b){
      const value=a.type==='credit'?-(b[a.id]??0):(b[a.id]??0);
      return `<div class="row account-row" data-account-id="${a.id}" role="button" tabindex="0" aria-label="${esc(a.name)}. Tap to edit." style="width:100%;border:0;background:transparent;text-align:left" onclick="openAccount('${a.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openAccount('${a.id}')}"><div style="display:flex;min-width:0;align-items:center"><span class="dot" style="background:${a.color||palette[0]}"></span><div><div class="name">${esc(a.name)}</div><div class="meta">${esc(a.bank||'No bank')} · ${esc(a.type)} · ${esc((state.colorTags||colorTagDefaults)[a.color]||'Unassigned')}</div></div></div><div class="amount ${value<0?'negative':'positive'}">${money(value)}</div></div>`;
    }
    function orderedAccounts(list){return [...list].sort((a,b)=>(a.color||'').localeCompare(b.color||''))}
    function txnRow(t){
      const a=state.accounts.find(x=>x.id===t.accountId),sign=t.type==='expense'?'-':t.type==='income'?'+':'',cls=t.type==='expense'?'negative':t.type==='income'?'positive':'';
      return `<button class="row" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left" onclick="openTransaction('${t.id}')"><div style="display:flex;min-width:0"><span class="dot" style="background:${categoryColor(t.category)}"></span><div style="min-width:0"><div class="name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.note||t.category)}</div><div class="meta">${t.date} · ${esc(a?a.name:'Deleted account')} · ${esc(t.category)}</div></div></div><div class="amount ${cls}">${sign}${money(t.amount)}</div></button>`;
    }
    function lastCompletedDate(r){
      let last=r.lastPaidDate||null;
      state.transactions.filter(t=>t.recurringId===r.id).forEach(t=>{const d=t.dueDate||t.date;if(!last||d>last)last=d});
      return last;
    }
    function nextRecurringOccurrence(r){
      const start=new Date(r.startDate+'T00:00:00'); if(Number.isNaN(start.getTime()))return null;
      const step=r.frequency==='Weekly'?7:r.frequency==='Quarterly'?91:30; let due=new Date(start);
      const last=lastCompletedDate(r);
      if(last){const lastDate=new Date(last+'T00:00:00');while(due<=lastDate)due.setDate(due.getDate()+step)}
      return due;
    }
    function transferLastCompletedDate(r){
      let last=r.lastPaidDate||null;
      state.transactions.filter(t=>t.recurringTransferId===r.id).forEach(t=>{const d=t.dueDate||t.date;if(!last||d>last)last=d});
      return last;
    }
    function nextRecurringTransferOccurrence(r){
      const start=new Date(r.startDate+'T00:00:00'); if(Number.isNaN(start.getTime()))return null;
      const step=r.frequency==='Weekly'?7:r.frequency==='Quarterly'?91:30; let due=new Date(start);
      const last=transferLastCompletedDate(r);
      if(last){const lastDate=new Date(last+'T00:00:00');while(due<=lastDate)due.setDate(due.getDate()+step)}
      return due;
    }
    function reminderItems(){
      const now=new Date(); now.setHours(0,0,0,0);
      const end=new Date(now); end.setDate(end.getDate()+30);
      const items=[];
      state.accounts.filter(a=>a.type==='credit'&&Number(a.paymentDeadline)>=1).forEach(a=>{
        let due=new Date(now.getFullYear(),now.getMonth(),Number(a.paymentDeadline));
        if(due<now)due=new Date(now.getFullYear(),now.getMonth()+1,Number(a.paymentDeadline));
        if(due<=end)items.push({kind:'creditcard',date:due,label:a.name+' payment deadline',detail:'Credit card · '+(a.bank||'No bank'),amount:null,color:'#ff3b30',accountId:a.id,overdue:false});
      });
      state.recurring.filter(r=>r.active!==false&&r.startDate).forEach(r=>{
        const due=nextRecurringOccurrence(r); if(!due)return;
        const overdue=due<now;
        if(due<=end)items.push({kind:'payment',date:due,label:r.name,detail:(r.frequency||'Monthly')+' · '+(r.accountId?(state.accounts.find(a=>a.id===r.accountId)?.name||'Deleted account'):'No account'),amount:r.amount,color:overdue?'#ff3b30':'#ff9500',recurringId:r.id,mode:r.mode||'manual',overdue});
      });
      state.recurringTransfers.filter(r=>r.active!==false&&r.startDate).forEach(r=>{
        const due=nextRecurringTransferOccurrence(r); if(!due)return;
        const overdue=due<now;
        if(due<=end)items.push({kind:'transfer',date:due,label:r.name,detail:(r.frequency||'Monthly')+' · '+(state.accounts.find(a=>a.id===r.fromAccountId)?.name||'Deleted account')+' → '+(state.accounts.find(a=>a.id===r.toAccountId)?.name||'Deleted account'),amount:r.amount,color:overdue?'#ff3b30':'#5856d6',recurringTransferId:r.id,mode:r.mode||'manual',overdue});
      });
      return items.sort((a,b)=>a.date-b.date);
    }
    function reminderCard(){
      const items=reminderItems();
      const now=new Date(); now.setHours(0,0,0,0);
      return `<div class="card"><h2>Reminders</h2>${items.length?items.map(r=>{
        const days=Math.round((r.date-now)/86400000), overdue=!!r.overdue, urgent=!overdue&&days<=3, soon=!overdue&&!urgent&&days<=7;
        const dateStyle=overdue?'color:var(--red);font-weight:700':urgent?'color:var(--red);font-weight:600':soon?'color:#ff9500;font-weight:600':'';
        const dateText=(overdue?'OVERDUE · ':'')+r.date.toLocaleDateString('en-PH',{month:'short',day:'numeric'});
        const clickAction=r.kind==='creditcard'?`openAccount('${r.accountId}')`:r.kind==='transfer'?`${r.mode==='manual'?'openManualTransferReminder':'openRecurringTransfer'}('${r.recurringTransferId}')`:`${r.mode==='manual'?'openManualReminder':'openRecurring'}('${r.recurringId}')`;
        return `<button class="row" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left" onclick="${clickAction}"><div style="display:flex;min-width:0"><span class="dot" style="background:${overdue?'var(--red)':r.color}"></span><div><div class="name">${esc(r.label)}</div><div class="meta" style="${dateStyle}">${dateText} · ${esc(r.detail)}</div></div></div>${r.amount===null?'<div class="amount negative">Due</div>':`<div><div class="amount negative">${money(r.amount)}</div><div class="meta">${r.mode==='auto'?'Auto-deduct':'Manual · tap to '+(r.kind==='transfer'?'move':'pay')}</div></div>`}</button>`;
      }).join(''):'<div class="empty">No credit card deadlines, recurring payments, or recurring transfers due in the next 30 days.</div>'}</div>`;
    }
    function openManualReminder(id){

      if(id)state.recurringTransfers[state.recurringTransfers.findIndex(x=>x.id===id)]=item;else state.recurringTransfers.push(item);closeSheet();render();saveState();
    }
    function markRecurringTransferPaid(id){const r=state.recurringTransfers.find(x=>x.id===id);if(!r)return;const from=state.accounts.find(a=>a.id===r.fromAccountId),to=state.accounts.find(a=>a.id===r.toAccountId);if(!from||!to){toast('Both accounts must exist to complete this transfer.');return}state.transactions.push({id:uid(),type:'payment',amount:Number(r.amount)||0,category:'Payment / Transfer',accountId:r.toAccountId,fromAccountId:r.fromAccountId,fee:Number(r.fee)||0,date:today(),recurringTransferId:r.id,note:r.name,createdAt:Date.now()});r.lastPaidDate=today();closeSheet();render();saveState()}
    function deleteRecurringTransfer(id){state.recurringTransfers=state.recurringTransfers.filter(x=>x.id!==id);closeSheet();render();saveState()}
    function promptAction(label,onDone){pendingAction=onDone;document.getElementById('dialog-content').innerHTML=`<p><strong>${esc(label)}</strong></p><input id="dialog-input" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:10px"><div class="button-row"><button class="btn secondary" onclick="closeDialog()">Cancel</button><button class="btn" onclick="runPrompt()">Save</button></div>`;document.getElementById('dialog-overlay').classList.remove('hidden');setTimeout(()=>document.getElementById('dialog-input').focus(),0)}
    function runPrompt(){const v=document.getElementById('dialog-input').value.trim(),fn=pendingAction;closeDialog();if(v&&fn)fn(v)}
    function addSetting(type,label){promptAction(label,v=>{if(!state[type].includes(v)){state[type].push(v);render();saveState()}})}
    function renameColorTag(color){promptAction('Rename '+colorTagLabel(color),v=>{state.colorTags={...(state.colorTags||colorTagDefaults),[color]:v};state.tags=[...new Set(palette.map(c=>state.colorTags[c]))];state.accounts.forEach(a=>{if(a.color===color)a.tags=[v]});render();saveState()})}
    function renameSetting(type,old){promptAction('Rename '+old,v=>{const i=state[type].indexOf(old);if(i>-1){state[type][i]=v;if(type==='banks')state.accounts.forEach(a=>{if(a.bank===old)a.bank=v});if(type.includes('Categories'))state.transactions.forEach(t=>{if(t.category===old)t.category=v});if(type==='tags')state.accounts.forEach(a=>{if(a.tags&&a.tags.includes(old))a.tags=a.tags.map(t=>t===old?v:t)});render();saveState()}})}
    function removeSetting(type,item){confirmAction('Remove '+item+' from this list?',()=>{state[type]=state[type].filter(x=>x!==item);if(type==='tags')state.accounts.forEach(a=>{if(a.tags)a.tags=a.tags.filter(t=>t!==item)});render();saveState()})}
    function resetAll(){state=freshState();render();saveState()}
    function confirmAction(message,yes){pendingAction=yes;document.getElementById('dialog-content').innerHTML=`<p>${esc(message)}</p><div class="button-row"><button class="btn secondary" onclick="closeDialog()">Cancel</button><button class="btn danger" onclick="runConfirm()">Confirm</button></div>`;document.getElementById('dialog-overlay').classList.remove('hidden')}
    function runConfirm(){const fn=pendingAction;closeDialog();if(fn)fn()}
    function closeDialog(){document.getElementById('dialog-overlay').classList.add('hidden')}
    function toast(message){const n=document.createElement('div');n.textContent=message;n.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 16px;border-radius:20px;z-index:100;font-size:14px;max-width:90%;text-align:center';document.body.appendChild(n);setTimeout(()=>n.remove(),2400)}
    loadState();
    render();
  </script>
 </body>
</html>
