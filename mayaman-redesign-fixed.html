<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root{
    --safe-bottom:env(safe-area-inset-bottom);--safe-top:env(safe-area-inset-top);
    --color-bg:#fcfcfc;--color-surface:#ffffff;--color-text:#1a181b;

    --shadow-sm:0 1px 2px rgba(26,24,27,.06);--shadow-md:0 8px 24px rgba(26,24,27,.10);--shadow-lg:0 16px 40px rgba(26,24,27,.16);
  }
  .btn{border-radius:999px!important;font-family:var(--font-body)!important;font-weight:600!important}
  .input{border-radius:16px!important}
  .dialog{border-radius:24px!important}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  .topbar{padding:calc(16px + var(--safe-top)) 20px 14px;position:sticky;top:0;background:var(--color-bg);z-index:10}
  .topbar h1{margin:0;font-size:21px;font-family:var(--font-heading);font-weight:400}
  .date-line{margin:4px 0 0;color:color-mix(in srgb,var(--color-text) 55%,transparent);font-size:12px;font-family:var(--font-body)}
  .main-area{flex:1;padding:4px 16px 116px;overflow:auto}
  .view{display:none}.view.active{display:block}
  .section{padding:16px;margin-bottom:12px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
  .section-title{margin:0 0 12px;font-size:12px;letter-spacing:.02em;font-weight:500;font-family:var(--font-body);color:color-mix(in srgb,var(--color-text) 55%,transparent);text-transform:none}
  .section-dark{background:var(--color-accent);color:#fff}
  .section-dark .name{color:#fff}
  .section-dark .meta{color:rgba(255,255,255,.72)}
  .section-dark .swatch{background:rgba(255,255,255,.22)!important;color:#fff}
  .section-dark .positive{color:#fff}
  .section-dark .negative{color:#ffd2bd}
  .section-dark .section-title{color:rgba(255,255,255,.75)}
  .balance{font-family:var(--font-heading);font-weight:800;font-size:clamp(26px,8vw,36px);margin:0;letter-spacing:0}
  .negative{color:var(--color-negative)}
  .positive{color:var(--color-positive)}
  .button-row{display:flex;gap:8px;margin-top:14px}
  .button-row .btn{flex:1}
  .btn-sm{padding:4px 12px;font-size:11px}
  .save-control{margin-top:10px;width:100%;display:flex}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0}
  .row:last-child{border-bottom:0}
  .name{font-weight:600;font-size:14.5px;font-family:var(--font-body)}
  .meta{font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:2px}
  .amount{font-weight:700;white-space:nowrap;font-family:var(--font-body);font-size:14px}
  .swatch{width:38px;height:38px;border-radius:50%;flex:none;margin-right:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;font-family:var(--font-heading)}
  .empty{color:color-mix(in srgb,var(--color-text) 55%,transparent);padding:18px 0;font-size:14px}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:2px;padding:8px 8px calc(8px + var(--safe-bottom));background:var(--color-surface);box-shadow:0 -1px 0 var(--color-divider);z-index:20}

  .fab{position:fixed;right:26px;bottom:calc(96px + var(--safe-bottom));width:54px;height:54px;border:0;border-radius:50%;background:var(--color-accent);color:var(--color-bg);display:grid;place-items:center;box-shadow:var(--shadow-md);z-index:21}

  .lock-sub{color:color-mix(in srgb,var(--color-text) 55%,transparent);font-size:13px;margin:8px 0 34px;font-family:var(--font-body)}
  .lock-dots{display:flex;gap:16px;margin-bottom:40px}

  .lock-dot.filled{background:var(--color-accent);border-color:var(--color-accent)}
  .lock-keypad{display:grid;grid-template-columns:repeat(3,72px);gap:16px}
  .lock-key{width:72px;height:72px;border-radius:50%;border:0;background:var(--color-surface);box-shadow:var(--shadow-sm);font-family:var(--font-body);font-size:24px;font-weight:600;color:var(--color-text);display:flex;align-items:center;justify-content:center}
  .lock-key:active{background:var(--color-accent-100)}
  .lock-key.spacer{background:transparent;box-shadow:none;pointer-events:none}
  .lock-key.backspace{background:transparent;box-shadow:none;font-size:19px;color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  .lock-error{color:var(--color-negative);font-size:12px;margin-top:18px;min-height:16px;font-weight:600}
  .lock-screen.shake{animation:lockShake .4s}
  @keyframes lockShake{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}
  .sheet-overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--color-neutral-900) 45%, transparent);z-index:50;display:flex;align-items:flex-end}
  .sheet{width:100%;max-height:88%;overflow:auto;background:var(--color-bg);border-radius:28px 28px 0 0;box-shadow:var(--shadow-lg);padding:20px 20px calc(28px + var(--safe-bottom))}
  .sheet h2{margin:0 0 18px;font-family:var(--font-heading)}
  .hidden{display:none!important}
  /* --- component styles that previously came from Canva's design-system bundle (_ds_bundle.css) --- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;padding:14px 20px;font-size:15px;line-height:1.2}
  .btn-primary{background:var(--color-accent);color:#fff}
  .btn-primary:active{background:var(--color-accent-600)}
  .btn-secondary{background:var(--color-accent-100);color:var(--color-accent-700)}
  .btn-secondary:active{background:color-mix(in srgb, var(--color-accent-100) 55%, var(--color-accent))}
  .btn-ghost{background:transparent;color:color-mix(in srgb,var(--color-text) 60%,transparent)}
  .input{width:100%;border:1px solid var(--color-divider);background:var(--color-surface);padding:12px 14px;color:var(--color-text);font-size:15px;appearance:none}
  .input:focus{outline:2px solid var(--color-accent);outline-offset:1px}
  .dialog-backdrop{position:fixed;inset:0;background:color-mix(in srgb, var(--color-neutral-900) 45%, transparent);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
  .dialog{background:var(--color-surface);padding:22px;width:min(340px,100%);box-shadow:var(--shadow-lg)}
  .dialog-title{margin:0 0 10px;font-weight:700;font-size:17px;font-family:var(--font-heading)}
  .dialog-body{margin:0 0 16px;font-size:14px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 75%,transparent)}
  .seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--color-accent-100)}
  .seg-opt{flex:1;text-align:center;padding:9px 4px;border-radius:999px;font-size:13px;font-weight:600;color:var(--color-accent-700);cursor:pointer;position:relative}
  .seg-opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
  .seg-opt:has(input:checked){background:var(--color-surface);color:var(--color-text);box-shadow:var(--shadow-sm)}
  .tabbar{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--color-accent-100);margin-bottom:14px}
  .tabbar-opt{flex:1;text-align:center;padding:9px 4px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--color-accent-700);cursor:pointer;position:relative;line-height:1.25}
  .tabbar-opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
  .tabbar-opt:has(input:checked){background:var(--color-accent);color:#fff}
  .card-visual{border-radius:20px;padding:22px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
  .card-visual-top{display:flex;justify-content:flex-end}
  .card-visual-brand{font-family:var(--font-heading);font-weight:800;font-size:18px;letter-spacing:.02em}
  .card-visual-number{font-family:var(--font-heading);font-size:19px;letter-spacing:.08em;margin:18px 0}
  .card-visual-meta{display:flex;justify-content:space-between;gap:12px}
  .card-visual-meta span{display:block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.75}
  .card-visual-meta strong{display:block;font-size:14px;font-weight:700;margin-top:3px}
  .credit-limit-card{display:flex;align-items:center;gap:16px;color:#fff}
  .credit-limit-card .credit-ring{flex:none;display:flex}
  .credit-limit-text{flex:1;min-width:0}
  .credit-limit-text span{display:block;font-size:12.5px;opacity:.85}
  .credit-limit-text strong{display:block;font-size:16.5px;font-weight:800;margin-top:3px}
  .copy-btn{border:0;background:var(--color-accent-100);color:var(--color-accent-700);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer;flex:none}
  .card-copy-btn{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer;flex:none}
  .value-with-copy{display:flex;align-items:center;gap:8px}
  @media(min-width:720px){.main-area{width:min(720px,100%);margin:0 auto}.topbar{padding-left:max(20px,calc((100% - 720px)/2));padding-right:max(20px,calc((100% - 720px)/2))}}
</style>
</head>

<script>

  const DEFAULT_PASSCODE = '9642';
  const DEFAULT_APP_NAME = 'Mayaman na ba ko?';
  let enteredPasscode = '';
  function pressLockKey(d){
    if(enteredPasscode.length>=4)return;
    enteredPasscode+=d;
    updateLockDots();
    if(enteredPasscode.length===4)setTimeout(checkPasscode,150);
  }
  function pressLockBackspace(){
    if(!enteredPasscode.length)return;
    enteredPasscode=enteredPasscode.slice(0,-1);
    updateLockDots();
  }
  function updateLockDots(){
    document.querySelectorAll('.lock-dot').forEach((d,i)=>d.classList.toggle('filled',i<enteredPasscode.length));
  }
  function checkPasscode(){
    if(enteredPasscode===(state.passcode||DEFAULT_PASSCODE)){
      unlockApp();
    }else{
      const lockScreen=document.getElementById('lock-screen'), err=document.getElementById('lock-error');
      lockScreen.classList.add('shake');
      if(err)err.textContent='Incorrect passcode';
      setTimeout(()=>{
        lockScreen.classList.remove('shake');
        enteredPasscode='';
        updateLockDots();
      },400);
    }
  }
  function unlockApp(){
    document.getElementById('lock-screen').classList.add('hidden');
    document.querySelector('.app-shell').classList.remove('hidden');
  }
  const STORAGE_KEY = 'money_tracker_state';
  const expenseDefaults = ['Groceries','Dates','Transport','Shopping','Bills & Utilities','Socials','Health','Rent','Subscriptions','Hobbies','Insurance','Other','Travel','Pet','Lialto'];
  const incomeDefaults = ['Payroll','Interest','Credit','Other','Marf House'];
  const bankDefaults = ['BPI','UnionBank','Maya','GCash','CIMB','Tonik','GoTyme','Maribank'];
  const palette = ['#007aff','#34c759','#ff9500','#ff3b30','#af52de','#5ac8fa','#ffcc00','#ff2d55','#5856d6','#00c7be'];
  const colorTagDefaults = {'#007aff':'Personal','#34c759':'Payroll','#ff9500':'Lialto','#ff3b30':'Emergency Fund','#af52de':'Credit Card','#5ac8fa':'N/A','#ffcc00':'Future Investments','#ff2d55':'N/A','#5856d6':'N/A','#00c7be':'Travel'};
  const paletteNames = {'#007aff':'Blue','#34c759':'Green','#ff9500':'Orange','#ff3b30':'Red','#af52de':'Purple','#5ac8fa':'Sky Blue','#ffcc00':'Yellow','#ff2d55':'Pink','#5856d6':'Indigo','#00c7be':'Teal'};
  function colorTagLabel(color){return `${paletteNames[color]||'Color'} - ${(state?.colorTags||colorTagDefaults)[color]||'Unassigned'}`}
  let state = freshState(), ready = false;
  let activityMonth = today().slice(0,7), reportsMonth = today().slice(0,7), filterType = 'all', filterAccount = 'all';
  let pendingAction = null;
  let dashboardTab = 'categories', accountsTab = 'bank', schedulesTab = 'payments', settingsTab = 'admin';
  function freshState(){ return {accounts:[],transactions:[],recurring:[],recurringTransfers:[],amortizations:[],expenseCategories:[...expenseDefaults],incomeCategories:[...incomeDefaults],banks:[...bankDefaults],tags:[...new Set(Object.values(colorTagDefaults))],colorTags:{...colorTagDefaults},passcode:DEFAULT_PASSCODE,appName:DEFAULT_APP_NAME}; }
  function normalise(data){
    const base = freshState(), next = {...base,...data};
    ['expenseCategories','incomeCategories','banks','tags','accounts','transactions','recurring','recurringTransfers','amortizations'].forEach(k=>{if(!Array.isArray(next[k]))next[k]=base[k]});
    next.colorTags={...colorTagDefaults,...(next.colorTags&&typeof next.colorTags==='object'?next.colorTags:{})};
    next.passcode=(typeof next.passcode==='string'&&/^\d{4}$/.test(next.passcode))?next.passcode:DEFAULT_PASSCODE;
    next.appName=(typeof next.appName==='string'&&next.appName.trim())?next.appName.trim():DEFAULT_APP_NAME;
    next.accounts=next.accounts.map(a=>({...a,tags:Array.isArray(a.tags)?a.tags:(typeof a.tags==='string'?a.tags.split(',').map(t=>t.trim()).filter(Boolean):[])}));
    next.accounts.forEach(a=>a.tags.forEach(t=>{if(!next.tags.includes(t))next.tags.push(t)}));
    next.amortizations=next.amortizations.map(m=>({...m,linkedAccountIds:Array.isArray(m.linkedAccountIds)?m.linkedAccountIds:[]}));
    return next;
  }
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  function localDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function today(){return localDateStr(new Date())}

  function nextRecurringOccurrence(r){

    const step=r.frequency==='Weekly'?7:r.frequency==='Quarterly'?91:r.frequency==='Annual'?365:30; let due=new Date(start);

  function nextCreditCardDue(a){

  function reminderItems(){

  function smoothPath(pts){
    if(pts.length<2) return pts.length===1?`M${pts[0][0]},${pts[0][1]}`:'';
    let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++){
      const midX=(pts[i-1][0]+pts[i][0])/2, midY=(pts[i-1][1]+pts[i][1])/2;
      d+=` Q${pts[i-1][0].toFixed(1)},${pts[i-1][1].toFixed(1)} ${midX.toFixed(1)},${midY.toFixed(1)}`;
    }
    const last=pts[pts.length-1];
    d+=` L${last[0].toFixed(1)},${last[1].toFixed(1)}`;
    return d;
  }
  function incomeVsSpendChart(){
    const months=[]; for(let i=5;i>=0;i--)months.push(shiftMonth(reportsMonth,-i));
    const incomeData=months.map(mo=>state.transactions.filter(t=>t.type==='income'&&t.date.slice(0,7)===mo).reduce((s,t)=>s+(Number(t.amount)||0),0));
    const expenseData=months.map(mo=>state.transactions.filter(t=>t.type==='expense'&&t.date.slice(0,7)===mo).reduce((s,t)=>s+(Number(t.amount)||0),0));
    const maxVal=Math.max(1,...incomeData,...expenseData);
    const W=340,H=108,padL=4,padR=68,padT=16,padB=6,plotW=W-padL-padR,plotH=H-padT-padB;
    const stepX=months.length>1?plotW/(months.length-1):0;
    const toPt=(v,i)=>[padL+stepX*i, padT+plotH-(v/maxVal*plotH)];
    const incomePts=incomeData.map((v,i)=>toPt(v,i));
    const expensePts=expenseData.map((v,i)=>toPt(v,i));
    const labels=months.map(mo=>`<span>${monthLabel(mo).slice(0,3)}</span>`).join('');
    const incomeLine=smoothPath(incomePts);
    const areaPath=`${incomeLine} L${incomePts[incomePts.length-1][0].toFixed(1)},${H} L${incomePts[0][0].toFixed(1)},${H} Z`;
    const lastIdx=incomePts.length-1, lastPt=incomePts[lastIdx], lastVal=incomeData[lastIdx];
    const lastExpPt=expensePts[expensePts.length-1], lastExpVal=expenseData[expenseData.length-1];
    const bubbleW=62;
    const incomeBubbleY=Math.min(Math.max(lastPt[1]-9,0),H-20);
    const expBubbleY=Math.min(Math.max(lastExpPt[1]-9,0),H-20);
    return `<div class="chart-legend"><span><span class="chart-dot" style="background:var(--color-accent)"></span>Income</span><span><span class="chart-dot" style="background:var(--color-negative)"></span>Expenses</span></div><svg class="income-spend-chart" viewBox="0 0 ${W} ${H}" width="100%" style="color:var(--color-text);aspect-ratio:${W}/${H};display:block"><defs><linearGradient id="incomeFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--color-accent)" stop-opacity="0.22"></stop><stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0"></stop></linearGradient></defs><path d="${areaPath}" fill="url(#incomeFill)" stroke="none"></path><path d="${smoothPath(expensePts)}" fill="none" stroke="var(--color-negative)" stroke-width="2.5" stroke-linecap="round"></path><path d="${incomeLine}" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round"></path><circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3.5" fill="var(--color-accent)" stroke="#fff" stroke-width="1.5"></circle><circle cx="${lastExpPt[0].toFixed(1)}" cy="${lastExpPt[1].toFixed(1)}" r="3.5" fill="var(--color-negative)" stroke="#fff" stroke-width="1.5"></circle><foreignObject x="${(lastExpPt[0]+7).toFixed(1)}" y="${expBubbleY.toFixed(1)}" width="${bubbleW}" height="18"><div xmlns="http://www.w3.org/1999/xhtml" style="background:var(--color-negative);color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;padding:2px 6px;text-align:center;white-space:nowrap;font-family:var(--font-body)">${money(lastExpVal)}</div></foreignObject><foreignObject x="${(lastPt[0]+7).toFixed(1)}" y="${incomeBubbleY.toFixed(1)}" width="${bubbleW}" height="18"><div xmlns="http://www.w3.org/1999/xhtml" style="background:var(--color-accent);color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;padding:2px 6px;text-align:center;white-space:nowrap;font-family:var(--font-body)">${money(lastVal)}</div></foreignObject></svg><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent);padding-right:64px">${labels}</div>`;
  }

  function openChangePasscode(){
    pendingAction=null;
    document.getElementById('dialog-content').innerHTML=`<p class="dialog-title">Change Passcode</p><div class="field"><label for="pc-current">Current Passcode</label><input class="input" id="pc-current" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••"></div><div class="field"><label for="pc-new">New Passcode</label><input class="input" id="pc-new" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4 digits"></div><div class="field"><label for="pc-confirm">Confirm New Passcode</label><input class="input" id="pc-confirm" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4 digits"></div><div class="button-row"><button class="btn btn-secondary" onclick="closeDialog()">Cancel</button><button class="btn btn-primary" onclick="saveNewPasscode()">Save</button></div>`;
    document.getElementById('dialog-overlay').classList.remove('hidden');
  }
  function saveNewPasscode(){
    const current=document.getElementById('pc-current').value;
    const next=document.getElementById('pc-new').value;
    const confirmVal=document.getElementById('pc-confirm').value;
    if(current!==(state.passcode||DEFAULT_PASSCODE)){toast('Current passcode is incorrect.');return}
    if(!/^\d{4}$/.test(next)){toast('New passcode must be exactly 4 digits.');return}
    if(next!==confirmVal){toast('New passcode entries do not match.');return}
    state.passcode=next;
    closeDialog();
    saveState();
    toast('Passcode updated.');
  }
  function confirmAction(message,yes){pendingAction=yes;document.getElementById('dialog-content').innerHTML=`<p class="dialog-body">${esc(message)}</p><div class="button-row"><button class="btn btn-secondary" onclick="closeDialog()">Cancel</button><button class="btn btn-primary" style="background:var(--color-accent-700)" onclick="runConfirm()">Confirm</button></div>`;document.getElementById('dialog-overlay').classList.remove('hidden')}
  function runConfirm(){const fn=pendingAction;closeDialog();if(fn)fn()}
  function closeDialog(){document.getElementById('dialog-overlay').classList.add('hidden')}
  function toast(message){const n=document.createElement('div');n.textContent=message;n.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--color-text);color:var(--color-bg);padding:10px 18px;z-index:100;font-size:13px;font-weight:600;max-width:90%;text-align:center';document.body.appendChild(n);setTimeout(()=>n.remove(),2400)}

  loadState();
  applyAppName(state.appName||DEFAULT_APP_NAME);
  render();
</script>
</body>
</html>
